[package]
name = "cydonia-remote"
description = "The remote protocol that lets other devices watch and drive a running Cydonia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "cydonia_remote"

[dependencies]
artifact.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = { workspace = true, optional = true, features = ["ws"] }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros"] }

[features]
server = ["dep:axum", "dep:futures", "dep:tokio"]

[dev-dependencies]
futures.workspace = true
tokio = { workspace = true, features = ["macros"] }
tokio-tungstenite = "0.29"
ureq.workspace = true

[[test]]
name = "server"
required-features = ["server"]
