<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<title>Cydonia</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				overflow: hidden;
				width: 100vw;
				height: 100vh;
				background: #fff;
			}

			@media (prefers-color-scheme: dark) {
				body {
					background: #0b0b0c;
				}
			}

			body > canvas {
				position: fixed;
				inset: 0;
				display: block;
				width: 100%;
				height: 100%;
			}

			#boot {
				position: fixed;
				z-index: 1;
				pointer-events: none;
				top: 50%;
				left: 50%;
				width: 80vw;
				text-align: center;
				transform: translate(-50%, -50%);
				color: #8b8f96;
				font: 14px system-ui, sans-serif;
			}
		</style>
	</head>
	<body>
		<p id="boot">Connecting to Cydonia</p>
		<script>
			function keepLiftedFingersFromLeavingTheCanvas(event) {
				if (event.pointerType === 'touch') event.stopImmediatePropagation();
			}
			window.addEventListener('pointerleave', keepLiftedFingersFromLeavingTheCanvas, true);

			function putTheKeyboardAwayWhenHidden() {
				if (document.hidden) document.activeElement?.blur?.();
			}
			document.addEventListener('visibilitychange', putTheKeyboardAwayWhenHidden);

			function scaleTheInterface(scale) {
				const ratio = window.devicePixelRatio;
				Object.defineProperty(window, 'devicePixelRatio', { get: () => ratio * scale });
				for (const axis of ['offsetX', 'offsetY', 'clientX', 'clientY']) {
					const read = Object.getOwnPropertyDescriptor(MouseEvent.prototype, axis).get;
					Object.defineProperty(MouseEvent.prototype, axis, {
						get() {
							return read.call(this) / scale;
						},
					});
				}
			}
			const coarse = matchMedia('(pointer: coarse)').matches;
			const scale = coarse ? 1.25 : 1;
			if (coarse) scaleTheInterface(scale);

			const TOUCH_SLOP = 8;
			const HEADER_BAND = 72;
			const MOMENTUM_WINDOW = 3000;
			let touch = null;
			let lastPan = { horizontal: false, at: -Infinity };

			function stopLeftoverMomentum(target, event) {
				for (const type of ['pointerdown', 'pointercancel']) {
					const stopper = new PointerEvent(type, {
						pointerId: 0x7fff,
						pointerType: 'touch',
						clientX: event.clientX * scale,
						clientY: event.clientY * scale,
						bubbles: true,
						cancelable: true,
					});
					stopper.cydoniaStopper = true;
					target.dispatchEvent(stopper);
				}
			}

			function momentumHasNothingToMove(event) {
				if (performance.now() - lastPan.at > MOMENTUM_WINDOW) return false;
				return lastPan.horizontal || event.clientY < HEADER_BAND;
			}

			window.addEventListener(
				'pointerdown',
				(event) => {
					if (event.pointerType !== 'touch' || event.cydoniaStopper) return;
					if (momentumHasNothingToMove(event)) {
						lastPan.at = -Infinity;
						stopLeftoverMomentum(event.target, event);
					}
					touch = { x: event.clientX, y: event.clientY, panned: false, horizontal: false };
				},
				true,
			);
			window.addEventListener(
				'pointermove',
				(event) => {
					if (event.pointerType !== 'touch' || !touch || event.cydoniaStopper) return;
					const dx = event.clientX - touch.x;
					const dy = event.clientY - touch.y;
					if (!touch.panned && Math.hypot(dx, dy) > TOUCH_SLOP) {
						touch.panned = true;
						touch.horizontal = Math.abs(dx) > Math.abs(dy);
					}
				},
				true,
			);
			window.addEventListener(
				'pointerup',
				(event) => {
					if (event.pointerType !== 'touch' || !touch || event.cydoniaStopper) return;
					if (touch.panned) lastPan = { horizontal: touch.horizontal, at: performance.now() };
					touch = null;
				},
				true,
			);
		</script>
		<script type="module">
			import init, { cydoniaBack } from './cydonia_mobile.js';

			window.cydoniaBack = cydoniaBack;

			init().catch((error) => {
				const boot = document.getElementById('boot');
				if (boot && !boot.textContent.startsWith('Cydonia did not start'))
					boot.textContent = `Cydonia did not start: ${error?.message ?? error}`;
			});
		</script>
	</body>
</html>
