<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<title>Cydonia</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				overflow: hidden;
				width: 100vw;
				height: 100vh;
				background: #fff;
			}

			@media (prefers-color-scheme: dark) {
				body {
					background: #0b0b0c;
				}
			}

			body > canvas {
				position: fixed;
				inset: 0;
				display: block;
				width: 100%;
				height: 100%;
			}

			#boot {
				position: fixed;
				z-index: 1;
				pointer-events: none;
				top: 50%;
				left: 50%;
				width: 80vw;
				text-align: center;
				transform: translate(-50%, -50%);
				color: #8b8f96;
				font: 14px system-ui, sans-serif;
			}
		</style>
	</head>
	<body>
		<p id="boot">Connecting to Cydonia</p>
		<script>
			function keepLiftedFingersFromLeavingTheCanvas(event) {
				if (event.pointerType === 'touch') event.stopImmediatePropagation();
			}
			window.addEventListener('pointerleave', keepLiftedFingersFromLeavingTheCanvas, true);

			function scaleTheInterface(scale) {
				const ratio = window.devicePixelRatio;
				Object.defineProperty(window, 'devicePixelRatio', { get: () => ratio * scale });
				for (const axis of ['offsetX', 'offsetY', 'clientX', 'clientY']) {
					const read = Object.getOwnPropertyDescriptor(MouseEvent.prototype, axis).get;
					Object.defineProperty(MouseEvent.prototype, axis, {
						get() {
							return read.call(this) / scale;
						},
					});
				}
			}
			if (matchMedia('(pointer: coarse)').matches) scaleTheInterface(1.25);
		</script>
		<script type="module">
			import init from './cydonia_mobile.js';

			init().catch((error) => {
				const boot = document.getElementById('boot');
				if (boot && !boot.textContent.startsWith('Cydonia did not start'))
					boot.textContent = `Cydonia did not start: ${error?.message ?? error}`;
			});
		</script>
	</body>
</html>
