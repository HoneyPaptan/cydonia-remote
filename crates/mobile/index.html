<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<title>Cydonia</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				-webkit-user-select: none;
				user-select: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
			}

			body {
				overflow: hidden;
				width: 100vw;
				height: 100vh;
				background: #fff;
			}

			@media (prefers-color-scheme: dark) {
				body {
					background: #0b0b0c;
				}
			}

			body > canvas {
				position: fixed;
				inset: 0;
				display: block;
				width: 100%;
				height: 100%;
			}

			#boot {
				position: fixed;
				z-index: 2;
				pointer-events: none;
				top: calc(env(safe-area-inset-top, 0px) + 14px);
				left: 50%;
				width: 20px;
				height: 20px;
				margin-left: -10px;
				border: 2px solid rgba(139, 143, 150, 0.3);
				border-top-color: #8b8f96;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
				transition: opacity 0.2s;
			}

			body[data-linked='true'] #boot {
				opacity: 0;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			#failure {
				position: fixed;
				z-index: 2;
				pointer-events: none;
				top: 50%;
				left: 50%;
				width: 80vw;
				text-align: center;
				transform: translate(-50%, -50%);
				color: #8b8f96;
				font: 14px system-ui, sans-serif;
			}
		</style>
	</head>
	<body>
		<div id="boot" role="status" aria-label="Connecting"></div>
		<p id="failure" hidden></p>
		<script>
			function keepLiftedFingersFromLeavingTheCanvas(event) {
				if (event.pointerType === 'touch') event.stopImmediatePropagation();
			}
			window.addEventListener('pointerleave', keepLiftedFingersFromLeavingTheCanvas, true);

			function keepLongPressesInsideTheApp(event) {
				const target = event.target;
				const editable = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement;
				if (!editable) event.preventDefault();
			}
			window.addEventListener('contextmenu', keepLongPressesInsideTheApp, true);
			document.addEventListener('selectstart', keepLongPressesInsideTheApp, true);

			function copyThroughASelection(text) {
				const field = document.createElement('textarea');
				field.value = text;
				field.readOnly = true;
				field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
				const previous = document.activeElement;
				document.body.appendChild(field);
				field.select();
				try {
					return document.execCommand('copy');
				} finally {
					field.remove();
					previous?.focus?.();
				}
			}
			function offerAClipboardWhereThePageIsNotSecure() {
				if (navigator.clipboard) return;
				const clipboard = {
					writeText: (text) =>
						copyThroughASelection(text)
							? Promise.resolve()
							: Promise.reject(new DOMException('Copy was refused', 'NotAllowedError')),
					read: () =>
						Promise.reject(new DOMException('Reading needs a secure page', 'NotAllowedError')),
				};
				Object.defineProperty(navigator, 'clipboard', { value: clipboard });
			}
			offerAClipboardWhereThePageIsNotSecure();

			function putTheKeyboardAway() {
				const active = document.activeElement;
				if (active instanceof HTMLInputElement || active instanceof HTMLTextAreaElement)
					active.setAttribute('inputmode', 'none');
				active?.blur?.();
			}
			document.addEventListener('visibilitychange', () => {
				if (document.hidden) putTheKeyboardAway();
			});
			window.addEventListener('cydonia-pause', putTheKeyboardAway);

			function scaleTheInterface(scale) {
				const ratio = window.devicePixelRatio;
				Object.defineProperty(window, 'devicePixelRatio', { get: () => ratio * scale });
				for (const axis of ['offsetX', 'offsetY', 'clientX', 'clientY']) {
					const read = Object.getOwnPropertyDescriptor(MouseEvent.prototype, axis).get;
					Object.defineProperty(MouseEvent.prototype, axis, {
						get() {
							return read.call(this) / scale;
						},
					});
				}
			}
			const coarse = matchMedia('(pointer: coarse)').matches;
			const scale = coarse ? 1.25 : 1;
			window.cydoniaScale = scale;
			window.cydoniaTouch = coarse;
			if (coarse) scaleTheInterface(scale);

			const KEYBOARD_MIN_HEIGHT = 120;

			function fitCanvasAboveKeyboard() {
				const canvas = document.querySelector('body > canvas');
				const viewport = window.visualViewport;
				if (!canvas || !viewport) return;
				const covered = document.documentElement.clientHeight - viewport.height;
				if (covered < KEYBOARD_MIN_HEIGHT) {
					canvas.style.removeProperty('top');
					canvas.style.removeProperty('bottom');
					canvas.style.removeProperty('height');
					return;
				}
				canvas.style.top = viewport.offsetTop + 'px';
				canvas.style.bottom = 'auto';
				canvas.style.height = viewport.height + 'px';
			}
			if (coarse && window.visualViewport) {
				window.visualViewport.addEventListener('resize', fitCanvasAboveKeyboard);
				window.visualViewport.addEventListener('scroll', fitCanvasAboveKeyboard);
			}

			const TOUCH_SLOP = 8;
			const HEADER_BAND = 72;
			const MOMENTUM_WINDOW = 3000;
			let touch = null;
			let lastPan = { horizontal: false, at: -Infinity };

			function stopLeftoverMomentum(target, event) {
				for (const type of ['pointerdown', 'pointercancel']) {
					const stopper = new PointerEvent(type, {
						pointerId: 0x7fff,
						pointerType: 'touch',
						clientX: event.clientX * scale,
						clientY: event.clientY * scale,
						bubbles: true,
						cancelable: true,
					});
					stopper.cydoniaStopper = true;
					target.dispatchEvent(stopper);
				}
			}

			function momentumHasNothingToMove(event) {
				if (performance.now() - lastPan.at > MOMENTUM_WINDOW) return false;
				return lastPan.horizontal || event.clientY < HEADER_BAND;
			}

			window.addEventListener(
				'pointerdown',
				(event) => {
					if (event.pointerType !== 'touch' || event.cydoniaStopper) return;
					if (momentumHasNothingToMove(event)) {
						lastPan.at = -Infinity;
						stopLeftoverMomentum(event.target, event);
					}
					touch = { x: event.clientX, y: event.clientY, panned: false, horizontal: false };
				},
				true,
			);
			window.addEventListener(
				'pointermove',
				(event) => {
					if (event.pointerType !== 'touch' || !touch || event.cydoniaStopper) return;
					const dx = event.clientX - touch.x;
					const dy = event.clientY - touch.y;
					if (!touch.panned && Math.hypot(dx, dy) > TOUCH_SLOP) {
						touch.panned = true;
						touch.horizontal = Math.abs(dx) > Math.abs(dy);
					}
				},
				true,
			);
			window.addEventListener(
				'pointerup',
				(event) => {
					if (event.pointerType !== 'touch' || !touch || event.cydoniaStopper) return;
					if (touch.panned) lastPan = { horizontal: touch.horizontal, at: performance.now() };
					touch = null;
				},
				true,
			);
		</script>
		<script type="module">
			const version = '__VERSION__';
			window.cydoniaVersion = version;

			try {
				const { default: init, cydoniaBack } = await import(`./cydonia_mobile.js?v=${version}`);
				window.cydoniaBack = cydoniaBack;
				await init({ module_or_path: `./cydonia_mobile_bg.wasm?v=${version}` });
			} catch (error) {
				const failure = document.getElementById('failure');
				if (failure && failure.hidden) {
					failure.textContent = `Cydonia did not start: ${error?.message ?? error}`;
					failure.hidden = false;
					document.getElementById('boot')?.remove();
				}
			}
		</script>
	</body>
</html>
